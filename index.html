<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Punchy In-Out 6.4</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; } 
body { font-family: 'Montserrat', sans-serif; /* Police Montserrat */; background:white; color:#222; }

.navbar {
  position: fixed;
  top:0; left:0;
  width:100%;
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:transparent;
  z-index:1100;
}

.nav-logo { font-weight:bold; font-size:1.8rem; }

.hamburger {
  display:flex;
  flex-direction:column;
  gap:5px;
  cursor:pointer;
  z-index:1101;
}

.hamburger span {
  width:30px;
  height:3px;
  background:#222;
  display:block;
  transition:0.3s;
}

.hamburger.active span:nth-child(1) {
  transform:rotate(45deg) translate(5px,5px);
}
.hamburger.active span:nth-child(2) {
  opacity:0;
}
.hamburger.active span:nth-child(3) {
  transform:rotate(-45deg) translate(5px,-5px);
}

/* Fond animé du menu */
.fullscreen-menu-bg {
  position: fixed;
  top:0; left:0;
  width:100%;
  height:0%;
  background:#a7a376;
  pointer-events:none;
  z-index:1050;
  overflow:hidden;
}

/* Conteneur des liens */
.fullscreen-menu-links {
  position: fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:1051;

  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease; /* durée par défaut */
  transition-delay: 0s;          /* délai par défaut */
}

.fullscreen-menu-links.show {
  opacity: 1;
  pointer-events: all;
}

.fullscreen-menu-links ul {
  list-style:none;
  text-align:center;
  padding:0;
  margin:0;
}

.fullscreen-menu-links li {
  margin:20px 0;
}

.fullscreen-menu-links li a {
  font-size:4.5rem;
  color:#222;
  text-decoration:none;
  text-transform: uppercase;
  font-weight: 500;
}

.fullscreen-menu-links li a:hover { opacity:0.8; }

body.no-scroll {
  overflow:hidden;
  height:100%;
}

@media (max-width:768px) {
  .fullscreen-menu-links li a { font-size:2rem; }
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="nav-logo">ΣΚΟΥΛΤΕΙΑ.</div>
  <div class="hamburger" id="hamburger">
    <span></span><span></span><span></span>
  </div>
</nav>

<!-- Fond animé -->
<div class="fullscreen-menu-bg" id="menu-bg"></div>

<!-- Liens fixes -->
<div class="fullscreen-menu-links" id="menu-links">
  <ul>
    <li><a href="#">Accueil,</a></li>
    <li><a href="#">Galerie,</a></li>
    <li><a href="#">Articles,</a></li>
    <li><a href="#">Contact.</a></li>
  </ul>
</div>

<script>
const hamburger = document.getElementById('hamburger');
const menuBg = document.getElementById('menu-bg');
const menuLinks = document.getElementById('menu-links');

let progress = 0;       // 0 à 100
let direction = 0;      // 1 = ouverture, -1 = fermeture
const duration = 1200;
let lastTime = null;

/* Easing custom puissance 6.4 */
function easeInOutPow64(t) {
  const power = 6.4;
  const factor = Math.pow(2, power - 1);
  if (t < 0.5) return factor * Math.pow(t, power);
  return 1 - Math.pow(-2*t + 2, power)/2;
}

function animate(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const delta = timestamp - lastTime;
  lastTime = timestamp;

  if (direction !== 0) {
    progress += (delta / duration) * 100 * direction;

    if (progress >= 100) { progress = 100; direction = 0; }
    if (progress <= 0)   { progress = 0; direction = 0; }

    const t = progress/100;
    const h = easeInOutPow64(t) * 100;
    menuBg.style.height = h + '%';

    // Scroll lock
    if (progress > 0) document.body.classList.add('no-scroll');
    else document.body.classList.remove('no-scroll');
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

hamburger.addEventListener('click', () => {
  hamburger.classList.toggle('active');

  if (progress === 0) direction = 1;
  else if (progress === 100) direction = -1;
  else direction *= -1;

  if (direction === 1) {
    // menu ouverture : régler délai et vitesse ici
    menuLinks.style.transitionDelay = '0.8s';   // délai avant apparition
    menuLinks.style.transitionDuration = '0.4s'; // durée de l'apparition
    menuLinks.classList.add('show');
  } else {
    // menu fermeture
    menuLinks.style.transitionDelay = '0s';
    menuLinks.style.transitionDuration = '0.3s'; // fermeture plus rapide
    menuLinks.classList.remove('show');
  }
});
</script>

</body>
</html>
