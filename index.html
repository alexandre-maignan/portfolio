<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Menu Bézier Clean</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: white;
  }

  /* NAVBAR */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 70px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    z-index: 5000;
  }

  /* BURGER */
  .burger {
    width: 40px;
    height: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    z-index: 6000;
  }

  .burger div {
    width: 28px;
    height: 3px;
    background: black;
    transition: 0.4s ease;
  }

  .burger.active div:nth-child(1) {
    transform: rotate(45deg) translate(6px, 6px);
  }

  .burger.active div:nth-child(2) {
    opacity: 0;
  }

  .burger.active div:nth-child(3) {
    transform: rotate(-45deg) translate(6px, -6px);
  }

  /* MENU BACKGROUND */
  .menu {
    position: fixed;
    inset: 0;
    background: #ffeb00;

    transform: scaleY(0);
    transform-origin: top;

    transition: transform 1s cubic-bezier(0.5, 0.1, 0.2, 1);

    z-index: 1000;
  }

  .menu.active {
    transform: scaleY(1);
  }

  /* CONTENT */
  .menu-content {
    position: fixed;
    inset: 0;

    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;

    z-index: 2000;

    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .menu-content.show {
    opacity: 1;
    pointer-events: all;
  }

  /* LINKS */
  .menu-content a {
    font-size: 50px;
    font-weight: 700;
    text-decoration: none;
    color: black;
    text-transform: uppercase;

    opacity: 0;
    transition: opacity 0.35s ease;
  }

  .menu-content.show a {
    opacity: 1;
  }

  .menu-content.show a:nth-child(1) { transition-delay: 0s; }
  .menu-content.show a:nth-child(2) { transition-delay: 0.08s; }
  .menu-content.show a:nth-child(3) { transition-delay: 0.18s; }

  .menu-content a:hover {
    opacity: 0.6;
  }
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div>LOGO</div>
  <div class="burger" onclick="toggleMenu()">
    <div></div>
    <div></div>
    <div></div>
  </div>
</div>

<!-- MENU -->
<div class="menu" id="menu"></div>

<!-- CONTENT -->
<div class="menu-content" id="content">
  <a href="#">Accueil</a>
  <a href="#">À propos</a>
  <a href="#">Services</a>
</div>

<script>
let open = false;
let animating = false;

let delay = 250;
let textDelay = 450;

const menu = document.getElementById("menu");
const content = document.getElementById("content");

/* TOGGLE MENU CLEAN */
function toggleMenu() {
  const burger = document.querySelector(".burger");

  if (animating) return;
  animating = true;

  open = !open;
  burger.classList.toggle("active");

  if (open) {

    setTimeout(() => {
      menu.classList.add("active");

      setTimeout(() => {
        content.classList.add("show");
        animating = false;
      }, textDelay);

    }, delay);

  } else {

    content.classList.remove("show");

    setTimeout(() => {
      menu.classList.remove("active");
      animating = false;
    }, delay);

  }
}
</script>

</body>
</html>




































<script>
(function (window, document) {
    "use strict";

    function initSmoothScroll(userOptions = {}) {
        const config = {
            MOBILE_BREAKPOINT: 768,
            baseEase: 0.05,
            maxEase: 0.5,
            distanceFactor: 2500,
            stopThreshold: 0.35,
            scrollMult: 1,
            minPageHeightRatio: 1.05,
            offset: 0,
            ...userOptions
        };

        const state = {
            enabled: false,
            running: false,
            current: 0,
            target: 0,
            maxScroll: 0
        };

        const clamp = (v, min, max) => Math.max(min, Math.min(v, max));

        /* ---------- Utils ---------- */

        function updateMaxScroll() {
            state.maxScroll =
                document.documentElement.scrollHeight - window.innerHeight;
        }

        function isMobile() {
            return window.innerWidth < config.MOBILE_BREAKPOINT;
        }

        function pageTooShort() {
            return (
                document.documentElement.scrollHeight <=
                window.innerHeight * config.minPageHeightRatio
            );
        }

        function setNativeScrollBehavior() {
            const behavior = isMobile() ? "smooth" : "auto";
            document.documentElement.style.scrollBehavior = behavior;
            document.body.style.scrollBehavior = behavior;
        }

        /* ---------- Core ---------- */

        function enable() {
            if (state.enabled) return;

            state.enabled = true;
            updateMaxScroll();

            state.current = state.target = window.scrollY;

            window.addEventListener("wheel", onWheel, { passive: false });
            window.addEventListener("scroll", syncScroll, { passive: true });
        }

        function disable() {
            if (!state.enabled) return;

            state.enabled = false;
            state.running = false;

            window.removeEventListener("wheel", onWheel);
            window.removeEventListener("scroll", syncScroll);
        }

        function onWheel(e) {
            if (e.ctrlKey) return;
            e.preventDefault();

            updateMaxScroll();

            state.target = clamp(
                state.target + e.deltaY * config.scrollMult,
                0,
                state.maxScroll
            );

            start();
        }

        function syncScroll() {
            if (!state.running) {
                state.current = state.target = window.scrollY;
            }
        }

        function start() {
            if (state.running) return;
            state.running = true;
            requestAnimationFrame(render);
        }

        function render() {
            if (!state.enabled) return;

            updateMaxScroll();
            state.target = clamp(state.target, 0, state.maxScroll);

            const diff = state.target - state.current;

            if (Math.abs(diff) < config.stopThreshold) {
                state.current = state.target;
                window.scrollTo(0, state.current);
                state.running = false;
                return;
            }

            const ratio = Math.min(1, Math.abs(diff) / config.distanceFactor);
            const ease =
                config.baseEase +
                (config.maxEase - config.baseEase) * ratio;

            state.current += diff * ease;
            window.scrollTo(0, state.current);

            requestAnimationFrame(render);
        }

        /* ---------- Anchors ---------- */

        function setupAnchors() {
            if (isMobile()) return; // 🔑 laisse le CSS gérer les ancres

            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener("click", e => {
                    const targetEl = document.querySelector(
                        anchor.getAttribute("href")
                    );
                    if (!targetEl) return;

                    e.preventDefault();
                    updateMaxScroll();

                    state.current = state.target = window.scrollY;
                    state.target =
                        targetEl.getBoundingClientRect().top +
                        window.scrollY +
                        config.offset;

                    state.target = clamp(state.target, 0, state.maxScroll);
                    start();
                });
            });
        }

        /* ---------- State ---------- */

        function checkState() {
            if (isMobile() || pageTooShort()) {
                disable();
            } else {
                enable();
            }
        }

        /* ---------- Init ---------- */

        setNativeScrollBehavior();
        checkState();
        setupAnchors();

        let resizeTimer;
        window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                setNativeScrollBehavior();
                updateMaxScroll();
                checkState();
            }, 120);
        });
    }

    window.initSmoothScroll = initSmoothScroll;

})(window, document);

window.addEventListener("load", () => {
    initSmoothScroll();
});
</script>
