<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Punchy In-Out</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; } 
body { font-family: 'Montserrat', sans-serif; background:white; color:#222; }

.navbar {
  position: fixed;
  top:0; left:0;
  width:100%;
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1100;
}

.nav-logo { font-weight:bold; font-size:1.8rem; }

.hamburger {
  display:flex;
  flex-direction:column;
  gap:5px;
  cursor:pointer;
  z-index:1101;
}

.hamburger span {
  width: 40px;
  height: 3px;
  background: #222;
  position: relative;
  transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
}

.hamburger.active span:nth-child(1) { top: 8px; }
.hamburger.active span:nth-child(2) { opacity: 0; }
.hamburger.active span:nth-child(3) { top: -8px; }

/* Fond */
.fullscreen-menu-bg {
  position: fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:#a7a376;
  z-index:1050;
  transform-origin: top;
  transform: scaleY(0);
}

/* Menu */
.fullscreen-menu-links {
  position: fixed;
  top:0; left:40px;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  z-index:1051;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.fullscreen-menu-links.show {
  opacity: 1;
  pointer-events: all;
}

.fullscreen-menu-links ul {
  list-style:none;
}

.fullscreen-menu-links li {
  margin:20px 0;

  /* animation stagger */
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.22,1,0.36,1);
}

.fullscreen-menu-links.show li {
  opacity: 1;
  transform: translateY(0);
}

.fullscreen-menu-links li a {
  font-size:4.5rem;
  color:#222;
  text-decoration:none;
  letter-spacing: -0.2rem;
  transition: opacity 0.3s ease;
}

/* hover focus */
.fullscreen-menu-links ul:hover li a:not(:hover) {
  opacity: 0.5;
}

body.no-scroll { overflow:hidden; }

@media (max-width:768px) {
  .fullscreen-menu-links li a { font-size:3rem; }
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="nav-logo">ΣΚΟΥΛΤΕΙΑ.</div>
  <div class="hamburger" id="hamburger">
    <span></span><span></span><span></span>
  </div>
</nav>

<div class="fullscreen-menu-bg" id="menu-bg"></div>

<div class="fullscreen-menu-links" id="menu-links">
  <ul>
    <li><a href="#">Accueil,</a></li>
    <li><a href="#">Galerie,</a></li>
    <li><a href="#">Articles,</a></li>
    <li><a href="#">Contact.</a></li>
  </ul>
</div>

<section style="height:200vh;padding:100px 40px;">
  <h2>Scroll test</h2>
</section>

<script>
const hamburger = document.getElementById('hamburger');
const menuBg = document.getElementById('menu-bg');
const menuLinks = document.getElementById('menu-links');

let progress = 0;
let direction = 0;
const duration = 1000; // plus rapide = meilleur UX
let lastTime = null;

function ease(t){
  return t<0.5
    ? Math.pow(2*t,6.4)/2
    : 1 - Math.pow(-2*t+2,6.4)/2;
}

function animate(timestamp){
  if(!lastTime) lastTime = timestamp;
  const delta = timestamp - lastTime;
  lastTime = timestamp;

  if(direction !== 0){
    progress += (delta/duration)*100*direction;

    if(progress >= 100){ progress = 100; direction = 0; }
    if(progress <= 0){ progress = 0; direction = 0; }

    menuBg.style.transform = `scaleY(${ease(progress/100)})`;

    if(progress > 0) document.body.classList.add('no-scroll');
    else document.body.classList.remove('no-scroll');
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

hamburger.addEventListener('click', ()=>{
  hamburger.classList.toggle('active');

  if(progress === 0) direction = 1;
  else if(progress === 100) direction = -1;
  else direction *= -1;

  const items = menuLinks.querySelectorAll('li');

  if(direction === 1){
    menuLinks.classList.add('show');

    items.forEach((item, index) => {
      item.style.transitionDelay = `${0.5 + index * 0.05}s`;
    });

  } else {
    menuLinks.classList.remove('show');

    items.forEach(item => {
      item.style.transitionDelay = '0s';
    });
  }
});
</script>

</body>
</html>




























































<script>
(function (window, document) {
    "use strict";

    function initSmoothScroll(userOptions = {}) {
        const config = {
            MOBILE_BREAKPOINT: 768,
            baseEase: 0.05,
            maxEase: 0.5,
            distanceFactor: 2500,
            stopThreshold: 0.35,
            scrollMult: 1,
            minPageHeightRatio: 1.05,
            offset: 0,
            ...userOptions
        };

        const state = {
            enabled: false,
            running: false,
            current: 0,
            target: 0,
            maxScroll: 0
        };

        const clamp = (v, min, max) => Math.max(min, Math.min(v, max));

        /* ---------- Utils ---------- */

        function updateMaxScroll() {
            state.maxScroll =
                document.documentElement.scrollHeight - window.innerHeight;
        }

        function isMobile() {
            return window.innerWidth < config.MOBILE_BREAKPOINT;
        }

        function pageTooShort() {
            return (
                document.documentElement.scrollHeight <=
                window.innerHeight * config.minPageHeightRatio
            );
        }

        function setNativeScrollBehavior() {
            const behavior = isMobile() ? "smooth" : "auto";
            document.documentElement.style.scrollBehavior = behavior;
            document.body.style.scrollBehavior = behavior;
        }

        /* ---------- Core ---------- */

        function enable() {
            if (state.enabled) return;

            state.enabled = true;
            updateMaxScroll();

            state.current = state.target = window.scrollY;

            window.addEventListener("wheel", onWheel, { passive: false });
            window.addEventListener("scroll", syncScroll, { passive: true });
        }

        function disable() {
            if (!state.enabled) return;

            state.enabled = false;
            state.running = false;

            window.removeEventListener("wheel", onWheel);
            window.removeEventListener("scroll", syncScroll);
        }

        function onWheel(e) {
            if (e.ctrlKey) return;
            e.preventDefault();

            updateMaxScroll();

            state.target = clamp(
                state.target + e.deltaY * config.scrollMult,
                0,
                state.maxScroll
            );

            start();
        }

        function syncScroll() {
            if (!state.running) {
                state.current = state.target = window.scrollY;
            }
        }

        function start() {
            if (state.running) return;
            state.running = true;
            requestAnimationFrame(render);
        }

        function render() {
            if (!state.enabled) return;

            updateMaxScroll();
            state.target = clamp(state.target, 0, state.maxScroll);

            const diff = state.target - state.current;

            if (Math.abs(diff) < config.stopThreshold) {
                state.current = state.target;
                window.scrollTo(0, state.current);
                state.running = false;
                return;
            }

            const ratio = Math.min(1, Math.abs(diff) / config.distanceFactor);
            const ease =
                config.baseEase +
                (config.maxEase - config.baseEase) * ratio;

            state.current += diff * ease;
            window.scrollTo(0, state.current);

            requestAnimationFrame(render);
        }

        /* ---------- Anchors ---------- */

        function setupAnchors() {
            if (isMobile()) return; // 🔑 laisse le CSS gérer les ancres

            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener("click", e => {
                    const targetEl = document.querySelector(
                        anchor.getAttribute("href")
                    );
                    if (!targetEl) return;

                    e.preventDefault();
                    updateMaxScroll();

                    state.current = state.target = window.scrollY;
                    state.target =
                        targetEl.getBoundingClientRect().top +
                        window.scrollY +
                        config.offset;

                    state.target = clamp(state.target, 0, state.maxScroll);
                    start();
                });
            });
        }

        /* ---------- State ---------- */

        function checkState() {
            if (isMobile() || pageTooShort()) {
                disable();
            } else {
                enable();
            }
        }

        /* ---------- Init ---------- */

        setNativeScrollBehavior();
        checkState();
        setupAnchors();

        let resizeTimer;
        window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                setNativeScrollBehavior();
                updateMaxScroll();
                checkState();
            }, 120);
        });
    }

    window.initSmoothScroll = initSmoothScroll;

})(window, document);

window.addEventListener("load", () => {
    initSmoothScroll();
});
</script>
