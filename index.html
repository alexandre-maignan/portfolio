<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Reveal vertical</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">


<style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {     display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Inter', sans-serif;
    background-color: white ;
    }

  :root {
    --font-size: 80px; /* ETAPE 1 : tu mets ta taille de police */
    --box-height: 63px;  /* ETAPE 2 : tu mets la  meme taille que item / ETAPE 4 : tu réajuste la taille de la boxe pour que en position haute, le bas soit pile sur les lettres */
    --stagger: 0.03s;
  }

  .container {
    display: flex;
    flex-direction: column;

    gap: 80px;
    background-color: transparent ; 
    padding: 40px 50px;
    
  }

  /* CHAQUE LIGNE */
  .item {
    height: var(--box-height); 
    width: auto;
  }

  /* MASQUE */
  .mask {
    height: var(--box-height); 
    overflow: hidden;
    background: transparent;
    
  }

  /* TEXTE */
  .text {
    display: flex;
    align-items: center;
    font-size: var(--font-size);
    font-weight: 600;
    text-transform: uppercase;
    transform: translateY(70px); /* ETAPE 5 : tu mets la  meme taille que item + quelques pixels */
    /* caché en bas */
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.1, 1);
    margin-top: -18px; /*ETAPE 3  - tu diminue le margin pour que en position haute, tu soit pile au bord de la case item /mask*/
    letter-spacing: -4px;
    padding-right: 20px;
    
  }

.text a {
  color: inherit;
  text-decoration: none;

  display: inline;
  padding: 0;
  margin: 0;

  opacity: 1;
  transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* quand un lien est hover → tous deviennent grisés */
.container:has(.text a:hover) .text a {
  opacity: 0.5;
}

/* MAIS le lien hover reste normal (plus spécifique + important) */
.container:has(.text a:hover) .text a:hover {
  opacity: 1;
}


  /* état visible */
  .show .text {
    transform: translateY(0);
  }

  .item {
    --i: 0;
  }

  .item:nth-child(1) {
    --i: 0;
  }

  .item:nth-child(2) {
    --i: 1;
  }

  .item:nth-child(3) {
    --i: 2;
  }

  .item:nth-child(4) {
    --i: 3;
  }

  .text {
    transition-delay: calc((var(--i) * var(--i)) * 0.02s);
  }

  button {
    position: absolute;
    bottom: 40px;
    padding: 10px 20px;
    cursor: pointer;
  }
</style>
</head>

<body>

<div class="container" id="container">

  <div class="item">
    <div class="mask">
      <div class="text"><a href="#">Accueil</a></div>
    </div>
  </div>

  <div class="item">
    <div class="mask">
      <div class="text"><a href="#">Projets</a></div>
    </div>
  </div>

  <div class="item">
    <div class="mask">
      <div class="text"><a href="#">Contact</a></div>
    </div>
  </div>

  <div class="item">
    <div class="mask">
      <div class="text"><a href="#">A propos</a></div>
    </div>
  </div>

</div>

<button onclick="toggleText()">Animer</button>

<script>
  let visible = false;

  function toggleText() {
    const container = document.getElementById("container");
    container.classList.toggle("show");
    visible = !visible;
  }
</script>

</body>
</html>
