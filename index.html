<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Menu Bézier Clean</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: white;
  }

  /* NAVBAR */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 70px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    z-index: 5000;
  }

  /* BURGER */
  .burger {
    width: 40px;
    height: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    z-index: 6000;
  }

  .burger div {
    width: 28px;
    height: 3px;
    background: black;
    transition: 0.4s ease;
  }

  .burger.active div:nth-child(1) {
    transform: rotate(45deg) translate(6px, 6px);
  }

  .burger.active div:nth-child(2) {
    opacity: 0;
  }

  .burger.active div:nth-child(3) {
    transform: rotate(-45deg) translate(6px, -6px);
  }

  /* MENU BACKGROUND */
  .menu {
    position: fixed;
    inset: 0;
    background: #ffeb00;

    transform: scaleY(0);
    transform-origin: top;

    transition: transform 1s cubic-bezier(0.5, 0.1, 0.2, 1);

    z-index: 1000;
  }

  .menu.active {
    transform: scaleY(1);
  }

  /* CONTENT */
  .menu-content {
    position: fixed;
    inset: 0;

    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;

    z-index: 2000;

    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .menu-content.show {
    opacity: 1;
    pointer-events: all;
  }

  /* LINKS */
  .menu-content a {
    font-size: 50px;
    font-weight: 700;
    text-decoration: none;
    color: black;
    text-transform: uppercase;

    opacity: 0;
    transition: opacity 0.35s ease;
  }

  .menu-content.show a {
    opacity: 1;
  }

  .menu-content.show a:nth-child(1) { transition-delay: 0s; }
  .menu-content.show a:nth-child(2) { transition-delay: 0.08s; }
  .menu-content.show a:nth-child(3) { transition-delay: 0.18s; }

  .menu-content a:hover {
    opacity: 0.6;
  }
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div>LOGO</div>
  <div class="burger" onclick="toggleMenu()">
    <div></div>
    <div></div>
    <div></div>
  </div>
</div>

<!-- MENU -->
<div class="menu" id="menu"></div>

<!-- CONTENT -->
<div class="menu-content" id="content">
  <a href="#">Accueil</a>
  <a href="#">À propos</a>
  <a href="#">Services</a>
</div>

<script>
let open = false;
let animating = false;

let delay = 250;
let textDelay = 450;

const menu = document.getElementById("menu");
const content = document.getElementById("content");

/* TOGGLE MENU CLEAN */
function toggleMenu() {
  const burger = document.querySelector(".burger");

  if (animating) return;
  animating = true;

  open = !open;
  burger.classList.toggle("active");

  if (open) {

    setTimeout(() => {
      menu.classList.add("active");

      setTimeout(() => {
        content.classList.add("show");
        animating = false;
      }, textDelay);

    }, delay);

  } else {

    content.classList.remove("show");

    setTimeout(() => {
      menu.classList.remove("active");
      animating = false;
    }, delay);

  }
}
</script>

</body>
</html>
