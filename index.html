<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Hover Slide Text</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: white;
  font-family: Poppins, sans-serif;
}

/* lien */
a {
  text-decoration: none;
  color: black;
}

/* BOX AUTO */
.box {
  --text-size:  clamp(24px, 4vw, 24px); /* hauteur de référence */
  --marge: 1.3;

  position: relative;
  overflow: hidden;
  display: inline-block;
  height: calc(var(--marge) * var(--text-size));
}

/* texte */
.text {
  --ls: -0.05em;
  font-size: var(--text-size); /* 🔥 height - 15% */
  font-weight: 500;
  letter-spacing: var(--ls);
  line-height: calc(var(--marge) * var(--text-size)); /* 🔥 line-height = height box */
  display: block;
  padding-right:calc(-1 * var(--ls));
}

/* animation */
.inner {
  transform: translateY(0);
  transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.05s;
}

/* hover */
.box:hover .inner {
  transform: translateY(-50%);
}
</style>
</head>

<body>

<a href="#">
  <div class="box">
    <div class="inner">
      <div class="text">A propos</div>
      <div class="text">A propos</div>
    </div>
  </div>
</a>

</body>
</html>
