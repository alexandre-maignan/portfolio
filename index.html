<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Punchy In-Out 6.4</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; } 
body { font-family:'Open Sans', sans-serif; background:#222; color:white; }

.navbar {
  position:fixed;
  top:0; left:0;
  width:100%;
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:transparent;
  z-index:1100;
}

.nav-logo { font-weight:bold; font-size:1.8rem; }

.hamburger {
  display:flex;
  flex-direction:column;
  gap:5px;
  cursor:pointer;
  z-index:1101;
}

.hamburger span {
  width:30px;
  height:3px;
  background:white;
  display:block;
  transition:0.3s;
}

.hamburger.active span:nth-child(1) {
  transform:rotate(45deg) translate(5px,5px);
}
.hamburger.active span:nth-child(2) {
  opacity:0;
}
.hamburger.active span:nth-child(3) {
  transform:rotate(-45deg) translate(5px,-5px);
}

.fullscreen-menu {
  position:fixed;
  top:0; left:0;
  width:100%;
  height:0;
  background:#a7a376;
  pointer-events:none;
  z-index:1050;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.fullscreen-menu.active { pointer-events:all; }

.fullscreen-menu ul {
  list-style:none;
  text-align:center;
}

.fullscreen-menu li {
  margin:20px 0;
  opacity:0;
  transform:translateY(40px);
}

.fullscreen-menu li a {
  font-size:3rem;
  color:#222;
  text-decoration:none;
  transition:opacity 0.3s;
}

.fullscreen-menu li a:hover { opacity:0.8; }

body.no-scroll {
  overflow:hidden;
  height:100%;
}

@media (max-width:768px) {
  .fullscreen-menu li a { font-size:2rem; }
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="nav-logo">ΣΚΟΥΛΤΕΙΑ.</div>
  <div class="hamburger" id="hamburger">
    <span></span><span></span><span></span>
  </div>
</nav>

<div class="fullscreen-menu" id="menu">
  <ul>
    <li><a href="#">Accueil</a></li>
    <li><a href="#">Galerie</a></li>
    <li><a href="#">Articles</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</div>

<script>
const hamburger = document.getElementById('hamburger');
const menu = document.getElementById('menu');
const links = menu.querySelectorAll('li');

let progress = 0;
let direction = 0;
const duration = 2000;
let lastTime = null;

/* 💥 Fonction easing custom avec puissance 6.4 */
function easeInOutPow64(t) {
  const power = 6.4;
  const factor = Math.pow(2, power - 1); // ajuste le coefficient pour rester dans [0,1]

  if (t < 0.5) {
    return factor * Math.pow(t, power);
  } else {
    return 1 - Math.pow(-2 * t + 2, power) / 2;
  }
}

function animate(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const delta = timestamp - lastTime;
  lastTime = timestamp;

  if (direction !== 0) {
    progress += (delta / duration) * 100 * direction;

    if (progress >= 100) { progress = 100; direction = 0; }
    if (progress <= 0)   { progress = 0; direction = 0; }

    const t = progress / 100;
    const h = easeInOutPow64(t) * 100;

    menu.style.height = h + '%';
    menu.classList.add('active');

    if (progress === 0 && direction === 0) {
      menu.classList.remove('active');
    }

    if (progress === 100) {
      document.body.classList.add('no-scroll');
      links.forEach((li,i)=>{
        li.style.transition = `transform 0.8s ease ${0.2+i*0.15}s, opacity 0.8s ease ${0.2+i*0.15}s`;
        li.style.transform = 'translateY(0)';
        li.style.opacity = '1';
      });
    } else {
      document.body.classList.remove('no-scroll');
      links.forEach(li=>{
        li.style.transform = 'translateY(40px)';
        li.style.opacity = '0';
        li.style.transition = '';
      });
    }
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

hamburger.addEventListener('click', () => {
  hamburger.classList.toggle('active');

  if (progress === 0) direction = 1;
  else if (progress === 100) direction = -1;
  else direction *= -1;
});
</script>

</body>
</html>
